<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="assets/css/style.css">
    <script src="assets/js/main.js" defer></script>
    <title>Deine Mahlzeit-App</title>
</head>

<body>
    <header>
        <div id="logo">
            <img src="assets/img/logo.png" alt="Mahlzeit-Logo" style="width: 150px;">
        </div>
        <nav>
            <a href="#">Entdecken</a>
            <a href="#">Kategorien</a>
            <a href="#">Zufallsrezept</a>
        </nav>
    </header>
    <main>
        <h1>Was kochen wir heute?</h1>
        <p class="sub">Suche nach einem Gericht oder lass dich überraschen.</p>

        <div class="such-container">
            <input type="text" id="suche-input" placeholder="z.B. Arabiata">
            <button id="btn-suchen">Suchen</button>
            <button id="btn-random">Überrasch mich!</button>
        </div>

        <div class="filter">
            <!-- <button onclick="filterInventar('all')">Alle</button> -->
            <button onclick = "filterRezepte('all')" class="filter-btn">Alle</button>
            <button onclick = "filterRezepte('beef')" class="filter-btn">Beef</button>
            <button onclick = "filterRezepte('chicken')" class="filter-btn">Chicken</button>
            <button onclick = "filterRezepte('dessert')" class="filter-btn">Dessert</button>
            <button onclick = "filterRezepte('pasta')" class="filter-btn">Pasta</button>
            <button onclick = "filterRezepte('seafood')" class="filter-btn">Seafood</button>
            <button onclick = "filterRezepte('vegetarian')" class="filter-btn">Vegetarian</button>
        </div>

        <h2>Gerichte</h2>
        <div class="gerichte-container" id="gerichte-container"></div>
    </main>

    <footer>
        <p>Rezeptdaten von <span><a href="https://www.themealdb.com/api.php">TheMealDB.com</a></span></p>

    </footer>

</body>

</html>
